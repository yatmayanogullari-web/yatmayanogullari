<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e3c3"/>
      <stop offset="0.52" stop-color="#ecd7ae"/>
      <stop offset="1" stop-color="#f1e0bd"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#caa76b" stop-opacity="0.55"/>
      <stop offset="0.15" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#caa76b" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.62
                0 0 0 0 0.52
                0 0 0 0 0.34
                0 0 0 0.18 0" result="grainy"/>
      <feBlend in="SourceGraphic" in2="grainy" mode="multiply"/>
    </filter>

    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a2a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#3a240d" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d18a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#b58a2b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8d18a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Ana zemin -->
  <rect x="36" y="28" width="1128" height="1744" rx="44" fill="url(#paper)" filter="url(#grain)"/>

  <!-- Kenar gölge/derinlik -->
  <rect x="36" y="28" width="1128" height="1744" rx="44" fill="url(#edge)" opacity="0.55"/>

  <!-- Üst / Alt bant (rulo hissi) -->
  <rect x="66" y="68" width="1068" height="86" rx="28" fill="url(#band)" opacity="0.38"/>
  <rect x="66" y="1646" width="1068" height="86" rx="28" fill="url(#band)" opacity="0.38"/>

  <!-- Osmanlı esintili basit arabesk süs -->
  <g opacity="0.55">
    <path d="M180 178
             C240 126, 340 126, 400 178
             C460 230, 560 230, 620 178
             C680 126, 780 126, 840 178"
          fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M360 178 C420 210, 500 210, 560 178
             C620 146, 700 146, 760 178"
          fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <path d="M180 1622
             C240 1674, 340 1674, 400 1622
             C460 1570, 560 1570, 620 1622
             C680 1674, 780 1674, 840 1622"
          fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M360 1622 C420 1590, 500 1590, 560 1622
             C620 1654, 700 1654, 760 1622"
          fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- İnce iç çerçeve -->
  <rect x="70" y="210" width="1060" height="1380" rx="36"
        fill="none" stroke="#4a2d12" stroke-opacity="0.16" stroke-width="3"/>
</svg>
