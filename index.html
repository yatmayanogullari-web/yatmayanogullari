<body>
  <div class="scene" role="application">
    <div class="scene__overlay" aria-hidden="true"></div>
    <div class="scene__dust" aria-hidden="true"></div>

    <main class="viewport">
      <section class="ferman" id="ferman" aria-label="İrtibât-ı Sürat Linkleri">
        <div class="ferman__shine" aria-hidden="true"></div>

        <header class="mast">
          <div class="tugra" aria-hidden="true">
            <img src="assets/textures/tugra.png" alt="" loading="eager" />
          </div>

          <h1>İRTİBÂT-I SÜRAT</h1>
          <p class="subtitle">Ziyaretçilerimiz için süratle açılan resmî geçit kapısı</p>
        </header>

        <nav class="links" aria-label="Hızlı Bağlantılar">

          <!-- KART: Örnek (aynı formatla çoğalt) -->
          <a
            href="https://betandyou-74338.bar/tr/registration?type=fast&bonus=SPORT"
            target="_blank"
            rel="noopener noreferrer"
            class="card reveal"
          >
            <div class="card__icon">
              <img
                src="https://statsdroneinc.com/media/betandyou-partners-medium.png"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              />
            </div>
            

            <div class="card__txt">
              <div class="card__top">
                <h2>BETANDYOU</h2>
                <span class="badge">Spor</span>
              </div>
              <p>%470'e varan spor hoş geldin bonusu</p>
            </div>

            <div class="card__arrow" aria-hidden="true">›</div>
          </a>
          <!-- Telegram Kanalı Kartı Başlangıç -->
          <a
            href="https://t.me/yatmayanogullari"
            target="_blank"
            rel="noopener noreferrer"
            class="card reveal"
          >
            <div class="card__icon">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/1200px-Telegram_logo.svg.png"
                alt="Telegram Kanalı Yatmayan Oğulları"
                loading="lazy"
                referrerpolicy="no-referrer"
              />
            </div>
            <div class="card__txt">
              <div class="card__top">
                <h2>YATMAYAN OĞULLARI</h2>
                <span class="badge">Kanal</span>
              </div>
              <p>En güncel <strong>tahminler</strong> ve <strong>analizler</strong> için katılın!</p>
               <!-- BetandYou kartında açıklama satırı var, dilerseniz buraya da ekleyebilirsiniz -->
               <!-- <p>En güncel duyurularımız için Telegram!</p> -->
            </div>
             <!-- Ok simgesi de eklendi -->
            <div class="card__arrow" aria-hidden="true">›</div>
          </a>
          <!-- Telegram Kanalı Kartı Bitiş -->

          <!-- YENİ KART EKLEME:
               Yukarıdaki <a class="card"> bloğunu kopyala,
               href + başlık + açıklama + badge değiştir. -->

        </nav>

        <footer class="seal">
          <div class="seal__line" aria-hidden="true"></div>
          <p>Bu ferman tarafımızca neşredilmiştir.</p>
        </footer>
      </section>
    </main>
  </div>

  <script src="script.js?v=219"></script>
