<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yatmayanoğulları</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      text-align: center;
      padding: 40px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      background: #020617;
    }
    h1 {
      margin: 0 0 10px;
      color: #38bdf8;
    }
    p {
      margin: 0;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Yatmayanoğulları</h1>
    <p>Cloudflare Pages test sayfası</p>
  </div>
</body>
</html>
