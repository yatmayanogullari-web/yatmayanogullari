<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#15110e" />
  <title>İRTİBÂT-I SÜRAT</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- JS varsa html'e sınıf ekle (animasyonlar vs için) -->
  <script>document.documentElement.classList.add('has-js');</script>

  <!-- Cache kırma -->
  <link rel="stylesheet" href="style.css?v=201" />
</head>

<body>
  <div class="scene" role="application">
    <div class="scene__overlay" aria-hidden="true"></div>
    <div class="scene__dust" aria-hidden="true"></div>

    <main class="viewport">
      <section class="ferman" id="ferman" aria-label="İrtibât-ı Sürat Linkleri">
        <div class="ferman__shine" aria-hidden="true"></div>

        <header class="mast">
          <div class="tugra" aria-hidden="true">
            <img src="assets/textures/tugra.png" alt="" loading="eager" />
          </div>

          <h1>İRTİBÂT-I SÜRAT</h1>
          <p class="subtitle">Ziyaretçilerimiz için süratle açılan resmî geçit kapısı</p>
        </header>

        <nav class="links" aria-label="Hızlı Bağlantılar">

          <!-- KART: Örnek (aynı formatla çoğalt) -->
          <a
            href="https://betandyou-62168.bar/tr/registration?type=fast&bonus=SPORT"
            target="_blank"
            rel="noopener noreferrer"
            class="card reveal"
          >
            <div class="card__icon">
              <img
                src="https://statsdroneinc.com/media/betandyou-partners-medium.png"
                alt=""
                loading="lazy"
                referrerpolicy="no-referrer"
              />
            </div>

            <div class="card__txt">
              <div class="card__top">
                <h2>BETANDYOU</h2>
                <span class="badge">Spor</span>
              </div>
              <p>%470'e varan spor hoş geldin bonusu</p>
            </div>

            <div class="card__arrow" aria-hidden="true">›</div>
          </a>

          <!-- YENİ KART EKLEME:
               Yukarıdaki <a class="card"> bloğunu kopyala,
               href + başlık + açıklama + badge değiştir. -->

        </nav>

        <footer class="seal">
          <div class="seal__line" aria-hidden="true"></div>
          <p>Bu ferman tarafımızca neşredilmiştir.</p>
        </footer>
      </section>
    </main>
  </div>

  <script src="script.js?v=211"></script>
</body>
</html>
